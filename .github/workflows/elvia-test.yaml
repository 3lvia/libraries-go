name: Elvia Test

on:
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/elvia-test.yaml'
      - 'pkg/elvia/**/*.go'
      - 'pkg/elvia/go.mod'
      - 'pkg/elvia/go.sum'
  pull_request:
    branches: [trunk]
    paths:
      - '.github/workflows/elvia-test.yaml'
      - 'pkg/elvia/**/*.go'
      - 'pkg/elvia/go.mod'
      - 'pkg/elvia/go.sum'

defaults:
  run:
    working-directory: ./pkg/elvia

jobs:
  test:
    name: Test
    runs-on: elvia-runner-v2
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: 'pkg/elvia/go.sum'

      - name: Install Go packages
        run: |
          go mod download
          go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest

      - name: Test with Go
        run: go test -v -json ./... > tests-$GO_VERSION.json
        env:
          GO_VERSION: ${{ matrix.go-version }}

      - name: Upload Go test results
        uses: actions/upload-artifact@v7
        with:
          name: 'Go-results-${{ matrix.go-version }}'
          path: 'pkg/elvia/tests-${{ matrix.go-version }}.json'

      - name: Prepare Test Report
        if: always()
        run: go-ctrf-json-reporter -o "$GITHUB_WORKSPACE/ctrf-$GO_VERSION.json" < "tests-$GO_VERSION.json"
        env:
          GO_VERSION: ${{ matrix.go-version }}

      - name: Publish Test Report
        if: always()
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: 'ctrf-${{ matrix.go-version }}.json'