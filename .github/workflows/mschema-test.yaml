name: MSchema Test

on:
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/mschema-test.yaml'
      - 'pkg/mschema/**/*.go'
      - 'pkg/mschema/go.mod'
      - 'pkg/mschema/go.sum'
  pull_request:
    branches: [trunk]
    paths:
      - '.github/workflows/mschema-test.yaml'
      - 'pkg/mschema/**/*.go'
      - 'pkg/mschema/go.mod'
      - 'pkg/mschema/go.sum'

defaults:
  run:
    working-directory: ./pkg/mschema

jobs:
  test:
    name: Test
    runs-on: elvia-runner
    strategy:
      matrix:
        go-version: ['1.25.x', '1.26.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: 'pkg/mschema/go.sum'

      - name: Install Go packages
        run: |
          go mod download
          go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest

      - name: Test with Go
        run: go test -v -json ./... > "tests-$GO_VERSION.json"
        env:
          GO_VERSION: ${{ matrix.go-version }}

      - name: Upload Go test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 'Go-results-${{ matrix.go-version }}'
          path: 'pkg/mschema/tests-${{ matrix.go-version }}.json'

      - name: Prepare Test Report
        if: always()
        run: go-ctrf-json-reporter -o "$GITHUB_WORKSPACE/ctrf-$GO_VERSION.json" < "tests-$GO_VERSION.json"
        env:
          GO_VERSION: ${{ matrix.go-version }}

      - name: Publish Test Report
        if: always()
        uses: ctrf-io/github-test-reporter@e500b992f936420eb633c91644cf10d4d71df700 # v1
        with:
          report-path: 'ctrf-${{ matrix.go-version }}.json'