name: Analyze

on:
  push:
    branches: [trunk]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [trunk]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: elvia-runner
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: 3lvia/core-github-actions-templates/analyze@cfcace852431a09d57ff7100da2177b56a9b562c # trunk
        with:
          language: 'go'