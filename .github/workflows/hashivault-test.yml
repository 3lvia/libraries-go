name: HashiVault Test

on:
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/hashivault-test.yml'
      - 'pkg/hashivault/**/*.go'
      - 'pkg/hashivault/go.mod'
      - 'pkg/hashivault/go.sum'
  pull_request:
    branches: [trunk]
    paths:
      - '.github/workflows/hashivault-test.yml'
      - 'pkg/hashivault/**/*.go'
      - 'pkg/hashivault/go.mod'
      - 'pkg/hashivault/go.sum'

defaults:
  run:
    working-directory: ./pkg/hashivault

jobs:
  test:
    name: Test
    runs-on: elvia-runner
    strategy:
      matrix:
        go-version: [ '1.23.x', '1.24.x' ]

    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: pkg/hashivault/go.sum
      - name: Install Go packages
        run: |
          go mod download
          go install github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter@latest
      - name: Test with Go
        run: go test -v -json ./... > tests-${{ matrix.go-version }}.json
      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: Go-results-${{ matrix.go-version }}
          path: pkg/hashivault/tests-${{ matrix.go-version }}.json
      - name: Prepare Test Report
        run: go-ctrf-json-reporter -o ${{ github.workspace }}/ctrf-${{ matrix.go-version }}.json < tests-${{ matrix.go-version }}.json
        if: always()
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: ctrf-${{ matrix.go-version }}.json
        if: always()